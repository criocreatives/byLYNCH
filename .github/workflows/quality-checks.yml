name: Build and validate byLYNCH

on:
  push:
    branches:
      - main
      - 'seo/**'
      - 'fix/**'
      - 'refactor/**'
  pull_request:
  workflow_dispatch:

concurrency:
  group: bylynch-quality-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  site-quality:
    runs-on: ubuntu-24.04
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Use supported Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.3'
      - name: Install the supported Jekyll build dependencies
        run: |
          gem install jekyll -v 4.4.1 --no-document
          gem install jekyll-paginate -v 1.1.0 --no-document
      - name: Install image validation dependencies
        run: python3 -m pip install 'Pillow>=10,<13' 'PyYAML>=6,<7'
      - name: Test non-destructive cover generation
        run: python3 -m unittest discover -s scripts/tests -v
      - name: Build the site
        run: jekyll build --trace
      - name: Validate SEO, archive and ad exclusions
        run: |
          python3 scripts/check_site.py
          python3 scripts/check_media.py
      - name: Check JavaScript syntax
        run: |
          node --check assets/js/site.js
          node --check assets/js/post.js
          node --check assets/js/privacy.js
          node --check assets/js/search.js
          node --check assets/js/lightbox.js
          python3 -m py_compile scripts/visual_regression.py
          python3 -m py_compile scripts/build_responsive_covers.py
          python3 -m py_compile scripts/annotate_gallery_dimensions.py
          python3 -m py_compile scripts/audit_external_links.py
