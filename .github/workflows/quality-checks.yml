name: Build and validate byLYNCH

on:
  push:
    branches:
      - main
      - 'seo/**'
      - 'fix/**'
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  site-quality:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.3'
      - name: Install the supported Jekyll build dependencies
        run: |
          gem install jekyll -v 4.4.1 --no-document
          gem install jekyll-paginate -v 1.1.0 --no-document
      - name: Build the site
        run: jekyll build --trace
      - name: Validate SEO, archive and ad exclusions
        run: python3 scripts/check_site.py
      - name: Check JavaScript syntax
        run: |
          node --check assets/js/site.js
          node --check assets/js/privacy.js
