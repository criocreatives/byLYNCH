name: One-time About portrait import
on:
  push:
    branches:
      - fix/about-avatar-brick-logo-20261015
    paths:
      - .github/workflows/import-about-photo.yml

permissions:
  contents: write

jobs:
  import-portrait:
    runs-on: ubuntu-latest
    steps:
      - name: Check out this branch
        uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Retrieve supplied Instagram-hosted photograph
        shell: bash
        env:
          PHOTO_URL: "https://scontent-mia5-1.xx.fbcdn.net/v/t51.82787-15/670834357_18433472938138869_32783821602583478_n.jpg?stp=dst-jpegr_tt6&cstp=mx1440x1920&ctp=s1440x1920&_nc_cat=104&ccb=1-7&_nc_sid=127cfc&_nc_ohc=P0dp_7CvBUYQ7kNvwFJUcKs&_nc_oc=AdrvfnnNYvTPpi0EDHNmTsre5zESzs59H9TQbbU_SdgHZ6VeIC7GySztFayV0TTwlIMWKTpSdDsWwjr4TFSzyRNb&_nc_zt=23&se=-1&_nc_ht=scontent-mia5-1.xx&_nc_gid=DZjoAxJUR_jvgFXJlgVXEg&_nc_ss=7b2a8&oh=00_AQNkRk0GgJnktrxqUtFWhf1gRyf1pdZ3SpSUlf_a4WyYEA&oe=6AD76E11"
        run: |
          python3 - <<'PY'
          import os
          from pathlib import Path
          from urllib.request import Request, urlopen
          url=os.environ['PHOTO_URL']
          request=Request(url,headers={
            'User-Agent':'Mozilla/5.0 (X11; Linux x86_64) AppleWebKit/537.36 Chrome/120.0 Safari/537.36',
            'Referer':'https://www.instagram.com/',
            'Accept':'image/avif,image/webp,image/jpeg,image/*;q=0.8,*/*;q=0.5'
          })
          with urlopen(request, timeout=30) as response:
            image=response.read()
          if not image.startswith(b'\xff\xd8\xff') or len(image)<8000:
            raise RuntimeError(f'No valid JPEG returned: {len(image)} bytes')
          dst=Path('assets/photos/about-lynch-instagram.jpg')
          dst.parent.mkdir(parents=True,exist_ok=True)
          dst.write_bytes(image)
          print(f'Saved {dst}: {len(image)} bytes')
          PY
      - name: Commit imported photo on staging branch
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/photos/about-lynch-instagram.jpg
          git commit -m "Save user-provided About portrait as permanent local site image"
          git push origin HEAD:fix/about-avatar-brick-logo-20261015
