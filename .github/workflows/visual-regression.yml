name: Visual regression and performance baseline
on:
  push:
    branches:
      - 'fix/**'
      - 'refactor/**'
      - 'seo/**'
  pull_request:
  workflow_dispatch:

concurrency:
  group: bylynch-visual-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  baseline-comparison:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - name: Checkout candidate with its Git history
        uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - name: Use supported Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Use supported Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.3'
      - name: Install pinned Jekyll build tools
        run: |
          gem install jekyll -v 4.4.1 --no-document
          gem install jekyll-paginate -v 1.1.0 --no-document
      - name: Build candidate
        run: jekyll build --trace
      - name: Fetch and build current production baseline
        shell: bash
        run: |
          set -euo pipefail
          git fetch --no-tags origin main --depth=1
          git worktree add --detach "$RUNNER_TEMP/bylynch-baseline" FETCH_HEAD
          jekyll build --source "$RUNNER_TEMP/bylynch-baseline" --destination "$RUNNER_TEMP/bylynch-baseline-site" --trace
      - name: Install browser testing dependencies
        run: |
          python3 -m pip install --user 'playwright==1.56.0' 'Pillow>=10,<12'
          python3 -m playwright install --with-deps chromium
      - name: Test legacy post preparation without content loss
        run: |
          python3 scripts/test_post_rendering.py
          python3 scripts/test_fallbacks.py
      - name: Compare desktop and mobile snapshots and interactions
        run: |
          python3 scripts/visual_regression.py \
            --baseline "$RUNNER_TEMP/bylynch-baseline-site" \
            --candidate "_site" \
            --out "$RUNNER_TEMP/bylynch-visual-comparison"
      - name: Preserve screenshot evidence and lab timings
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: bylynch-visual-and-performance-report
          path: ${{ runner.temp }}/bylynch-visual-comparison/
          if-no-files-found: warn
          retention-days: 14
