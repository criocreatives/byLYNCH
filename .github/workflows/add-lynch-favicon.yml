name: Add LYNCH favicon

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/add-lynch-favicon.yml'

permissions:
  contents: write

jobs:
  import:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Download favicon
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p assets/brand
          curl -L --fail --retry 3 -o assets/brand/lynch-favicon.png 'https://photoshop-api.adobe.io/v2/short-url/urn:aaid:ps:US:e0184912-5d2b-4349-8b60-f0f648fe1ddb'
      - name: Commit favicon and remove importer
        shell: bash
        run: |
          rm -f .github/workflows/add-lynch-favicon.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add assets/brand/lynch-favicon.png .github/workflows/add-lynch-favicon.yml
          git commit -m 'Add LYNCH favicon'
          git push
