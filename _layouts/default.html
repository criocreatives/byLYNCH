<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>{% if page.title %}{{ page.title }} — {% endif %}{{ site.title }}</title>
<meta name="description" content="{{ page.excerpt | default: site.description | strip_html | strip_newlines | truncate: 160 }}">
<link rel="canonical" href="{{ page.url | absolute_url }}">
<link rel="stylesheet" href="{{ '/assets/css/site.css' | relative_url }}">
</head>
<body class="{% if page.layout == 'post' %}single{% elsif page.archive %}blog archive-page{% elsif page.url == '/' %}blog{% endif %}">
<div id="page" class="hfeed site-shell">
<header class="site-header">
  <div class="site-header-inner">
    <div class="site-branding">
      <a class="site-logo-link" href="{{ '/' | relative_url }}"><img src="{{ '/assets/brand/lynch-logo.svg' | relative_url }}" alt="LYNCH"></a>
    </div>
    <nav id="site-navigation" class="main-navigation" aria-label="Primary Menu">
      <button class="menu-toggle" type="button" aria-controls="primary-menu" aria-expanded="false"><span class="screen-reader-text">Primary Menu</span></button>
      <div class="menu-primary-container">
        <ul id="primary-menu" class="nav-menu">
          <li class="current-menu-item"><a href="{{ '/' | relative_url }}">HOME</a></li>
          <li><a href="https://gumroad.com/seenbylynch" target="_blank" rel="noopener">STORE</a></li>
          <li><a href="{{ '/archive/?cat=FILM' | relative_url }}">FILM</a></li>
          <li class="menu-item-has-children"><a href="{{ '/archive/?cat=CULTURE' | relative_url }}">CULTURE &amp; ARTS</a>
            <ul class="sub-menu"><li><a href="{{ '/archive/?tag=music' | relative_url }}">MUSIC</a></li><li><a href="{{ '/archive/?cat=ARTS' | relative_url }}">ARTS</a></li><li><a href="{{ '/archive/?cat=NEW%20WAVE' | relative_url }}">NEW WAVE</a></li></ul>
          </li>
          <li><a href="{{ '/archive/' | relative_url }}">ARCHIVE</a></li>
          <li><a href="{{ '/archive/?cat=PIXTAPE' | relative_url }}">PIXTAPE</a></li>
          <li><a href="https://instagram.com/lebosslynch/" target="_blank" rel="noopener">INSTAGRAM</a></li>
          <li><a href="{{ '/about/' | relative_url }}">about LYNCH</a></li>
        </ul>
      </div>
    </nav>
    <div class="search-header"><button class="search-toggle" type="button" aria-label="Search"></button></div>
  </div>
</header>
{{ content }}
<footer class="site-footer"><div class="site-footer-inner">© {{ 'now' | date: '%Y' }} by LYNCH</div></footer>
</div>
<script src="{{ '/assets/js/site.js' | relative_url }}"></script>
</body></html>
